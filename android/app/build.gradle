plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Add the Google services Gradle plugin
    id "com.google.gms.google-services"

}

// 1. ضيف الجزء ده فوق خالص عشان يقرأ ملف الـ key.properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.careLine.app"
    compileSdk = 36
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    // 2. ضيف الجزء ده عشان يعرف بيانات المفتاح (Keystore)
    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "com.careLine.app"
        minSdk 24
        targetSdk = flutter.targetSdkVersion
        versionCode = 1 // اتأكد إنه دايمًا رقم صحيح
        versionName = "1.0.0"
    }

    buildTypes {
        release {
            // 3. هنا بقى بنقوله استخدم الـ release config بدل الـ debug
            signingConfig = signingConfigs.release

            // دول عشان الأمان ولتصغير حجم الأبلكيشن (اختياري)
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.window:window:1.5.0'
    implementation 'androidx.window:window-java:1.5.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.11.0')


    // TODO: Add the dependencies for Firebase products you want to use
    // When using the BoM, don't specify versions in Firebase dependencies
    implementation 'com.google.firebase:firebase-analytics'


    // Add the dependencies for any other desired Firebase products
    // https://firebase.google.com/docs/android/setup#available-libraries
}
apply plugin: 'com.google.gms.google-services'