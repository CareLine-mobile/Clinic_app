<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Responsive viewport — critical for mobile browser layout -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Clinic App — Find and book clinics near you.">
  <meta name="google-signin-client_id" content="1051363714209-kuqsn9psu5bhsj0dut8shp9nbblpndlg.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Clinic App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Clinic App</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API — required for google_maps_flutter web -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDg3ZMTizoSwd52bmeUzc1QdE_mCWlO2Lk"></script>
</head>
<body>
  <!--
    Flutter Web bootstrap. Uses CanvasKit renderer by default for best
    fidelity. Pass ?flutter_web_renderer=html to the URL to force the HTML
    renderer if CanvasKit is too heavy on a target device.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
